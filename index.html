<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Frontline // Vogelperspektive</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b120c; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // ---------- Setup ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let vignetteGradient = null;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.55)");
    vignetteGradient = vg;
  }

  // Keep the iPad screen awake if the platform allows it.
  let wakeLock = null;
  async function requestWake() {
    try {
      if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) { /* not critical */ }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") requestWake();
  });
  requestWake();

  // ---------- Helpers ----------
  const TAU = Math.PI * 2;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // ---------- Seamless terrain tile (built once, tiled infinitely under the camera) ----------
  let terrainPattern = null;
  function buildTerrainTile() {
    const size = 480;
    const tile = document.createElement("canvas");
    tile.width = size; tile.height = size;
    const tc = tile.getContext("2d");
    tc.fillStyle = "#17271a";
    tc.fillRect(0, 0, size, size);

    function speck(x, y, r, col) {
      tc.fillStyle = col;
      tc.beginPath();
      tc.ellipse(x, y, r, r * rand(0.6, 1.4), rand(0, TAU), 0, TAU);
      tc.fill();
    }
    // draw with edge-wrap so the tile repeats seamlessly
    function wrapped(x, y, r, col) {
      const offsets = [[0, 0]];
      if (x < r) offsets.push([size, 0]);
      if (x > size - r) offsets.push([-size, 0]);
      if (y < r) offsets.push([0, size]);
      if (y > size - r) offsets.push([0, -size]);
      if (x < r && y < r) offsets.push([size, size]);
      if (x > size - r && y > size - r) offsets.push([-size, -size]);
      if (x < r && y > size - r) offsets.push([size, -size]);
      if (x > size - r && y < r) offsets.push([-size, size]);
      for (const [ox, oy] of offsets) speck(x + ox, y + oy, r, col);
    }

    const speckCount = 900;
    for (let i = 0; i < speckCount; i++) {
      const x = Math.random() * size, y = Math.random() * size;
      const r = rand(0.6, 2.6);
      const shade = rand(0, 1);
      const col = shade < 0.5
        ? `rgba(${40 + shade * 40},${75 + shade * 55},${35 + shade * 30},${rand(0.1, 0.22)})`
        : `rgba(${18 + shade * 20},${42 + shade * 20},${18 + shade * 15},${rand(0.1, 0.2)})`;
      wrapped(x, y, r, col);
    }
    const patchCount = 6;
    for (let i = 0; i < patchCount; i++) {
      const x = Math.random() * size, y = Math.random() * size, r = rand(50, 110);
      const grd = tc.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, "rgba(60,50,35,0.10)");
      grd.addColorStop(1, "rgba(60,50,35,0)");
      tc.fillStyle = grd;
      tc.beginPath(); tc.arc(x, y, r, 0, TAU); tc.fill();
      if (x < r) { tc.beginPath(); tc.arc(x + size, y, r, 0, TAU); tc.fillStyle = grd; tc.fill(); }
      if (x > size - r) { tc.beginPath(); tc.arc(x - size, y, r, 0, TAU); tc.fillStyle = grd; tc.fill(); }
    }
    terrainPattern = ctx.createPattern(tile, "repeat");
  }

  // ---------- Obstacles ("natural" rocks), generated ahead of the camera, culled behind ----------
  let obstacles = [];
  let obstacleFrontier = 0; // smallest (furthest-ahead / most negative) world Y generated so far
  const OBSTACLE_STRIP_H = 500;
  const OBSTACLE_LOOKAHEAD = 1100;
  const OBSTACLE_BEHIND_CULL = 900;
  const GEN_WIDTH = 1500;

  function makeRock(cx, topY, botY) {
    const r = rand(18, 46);
    const x = cx + rand(-GEN_WIDTH / 2, GEN_WIDTH / 2);
    const y = rand(topY, botY);
    const lumps = [];
    const n = randInt(5, 8);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rand(-0.15, 0.15);
      lumps.push({ a, rr: r * rand(0.7, 1.15) });
    }
    return { x, y, r, lumps, shade: rand(0, 1) };
  }

  function generateObstacleStrip(cx, topY, botY) {
    const area = (botY - topY) * GEN_WIDTH;
    const count = Math.max(3, Math.floor(area / 55000));
    for (let i = 0; i < count; i++) obstacles.push(makeRock(cx, topY, botY));
  }

  function initObstacles(cx, startY) {
    obstacles = [];
    obstacleFrontier = startY - OBSTACLE_LOOKAHEAD;
    generateObstacleStrip(cx, obstacleFrontier, startY + 500);
  }

  function updateObstacles(camX, camY) {
    if (camY - obstacleFrontier < OBSTACLE_LOOKAHEAD) {
      const newFrontier = obstacleFrontier - OBSTACLE_STRIP_H;
      generateObstacleStrip(camX, newFrontier, obstacleFrontier);
      obstacleFrontier = newFrontier;
    }
    if (obstacles.length > 260 || Math.random() < 0.02) {
      const cullY = camY + OBSTACLE_BEHIND_CULL;
      obstacles = obstacles.filter(o => o.y < cullY);
    }
  }

  function drawRock(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.beginPath();
    ctx.ellipse(o.r * 0.18, o.r * 0.28, o.r * 1.05, o.r * 0.7, 0, 0, TAU);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();
    ctx.beginPath();
    o.lumps.forEach((l, i) => {
      const px = Math.cos(l.a) * l.rr, py = Math.sin(l.a) * l.rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.closePath();
    const base = lerp(70, 100, o.shade);
    const grd = ctx.createLinearGradient(-o.r, -o.r, o.r, o.r);
    grd.addColorStop(0, `rgb(${base + 20},${base + 14},${base})`);
    grd.addColorStop(1, `rgb(${base - 30},${base - 32},${base - 34})`);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  // ---------- Mech classes ----------
  const CLASS = {
    LIGHT:   { name: "light",   rank: 1, r: 11, speed: 84, hp: 16 },
    MEDIUM:  { name: "medium",  rank: 2, r: 15, speed: 64, hp: 28 },
    HEAVY:   { name: "heavy",   rank: 3, r: 20, speed: 46, hp: 48 },
    ASSAULT: { name: "assault", rank: 4, r: 25, speed: 34, hp: 78 }
  };

  const WEAPON = {
    SMALL:     { key: "small",     color: "#ff3b3b", glow: "rgba(255,59,59,0.9)",   dmg: 1, range: 220, cd: 0.45, kind: "beam" },
    MEDIUM:    { key: "medium",    color: "#39ff6a", glow: "rgba(57,255,106,0.9)",  dmg: 2, range: 300, cd: 0.9,  kind: "beam" },
    LARGE:     { key: "large",     color: "#3b8cff", glow: "rgba(59,140,255,0.9)",  dmg: 4, range: 380, cd: 1.5,  kind: "beam" },
    LRM:       { key: "lrm",       color: "#ffb347", glow: "rgba(255,179,71,0.9)",  dmg: 2, range: 440, cd: 2.6,  kind: "swarm" },
    BALLISTIC: { key: "ballistic", color: "#fff2a8", glow: "rgba(255,235,160,0.9)", dmg: 3, range: 340, cd: 0.85, kind: "projectile", speed: 1500 }
  };
  const WEAPON_LIST = [WEAPON.SMALL, WEAPON.MEDIUM, WEAPON.LARGE, WEAPON.LRM, WEAPON.BALLISTIC];

  // ---------- Entities (all in world coordinates) ----------
  let allies = [];
  let enemies = [];
  let beams = [];
  let swarms = [];
  let slugs = [];
  let particles = [];
  let shocks = [];
  const camera = { x: 0, y: 0 };

  function makeAlly(i, n) {
    const cls = Math.random() < 0.45 ? CLASS.ASSAULT : CLASS.HEAVY;
    const weapons = [];
    const wCount = cls === CLASS.ASSAULT ? 2 : 1;
    const shuffled = WEAPON_LIST.slice().sort(() => Math.random() - 0.5);
    for (let k = 0; k < wCount; k++) weapons.push({ def: shuffled[k % shuffled.length], cd: rand(0, 1.5) });
    // start evenly spread across the formation band, with a little jitter
    const spread = n > 1 ? (i / (n - 1) - 0.5) * 0.8 : 0;
    return {
      side: "ally", cls,
      x: rand(-40, 40), y: rand(-40, 40),
      heading: -Math.PI / 2 + rand(-0.2, 0.2),
      wanderPhase: rand(0, TAU), wanderSpeed: rand(0.3, 0.7), legPhase: rand(0, TAU),
      laneFrac: spread + rand(-0.06, 0.06), laneTimer: rand(2, 6),
      weapons, alive: true
    };
  }

  function makeEnemy(cx, cy) {
    const roll = Math.random();
    const cls = roll < 0.30 ? CLASS.LIGHT : roll < 0.58 ? CLASS.MEDIUM : roll < 0.85 ? CLASS.HEAVY : CLASS.ASSAULT;
    const x = cx + rand(-W * 0.42, W * 0.42);
    const y = cy - H * 0.72 - rand(0, 220);
    return {
      side: "enemy", cls, x, y,
      heading: Math.PI / 2,
      wanderPhase: rand(0, TAU), wanderSpeed: rand(0.3, 0.6), legPhase: rand(0, TAU),
      hp: cls.hp, maxHp: cls.hp,
      fireCd: rand(0.4, 1.6), alive: true
    };
  }

  function initAllies() {
    allies = [];
    for (let i = 0; i < 7; i++) allies.push(makeAlly(i, 7));
  }

  // ---------- Steering ----------
  const ZERO_BIAS = { x: 0, y: 0 };
  function obstacleAvoidance(x, y, pushOut) {
    let ax = 0, ay = 0;
    for (const o of obstacles) {
      const margin = o.r + 26;
      const dx = x - o.x, dy = y - o.y;
      const d2 = dx * dx + dy * dy;
      const margin2 = margin * margin;
      if (d2 < margin2 && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const f = (margin - d) / margin;
        ax += (dx / d) * f * f * pushOut;
        ay += (dy / d) * f * f * pushOut;
      }
    }
    return { x: ax, y: ay };
  }

  function separation(list, self, radius) {
    let sx = 0, sy = 0;
    for (const o of list) {
      if (o === self || (o.alive === false)) continue;
      const dx = self.x - o.x, dy = self.y - o.y;
      const d2 = dx * dx + dy * dy;
      const r2 = radius * radius;
      if (d2 < r2 && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const f = (radius - d) / radius;
        sx += (dx / d) * f; sy += (dy / d) * f;
      }
    }
    return { x: sx, y: sy };
  }

  // ---------- Combat ----------
  function nearestTarget(from, list, maxRange) {
    let best = null, bestD = maxRange * maxRange;
    for (const t of list) {
      if (t.alive === false) continue;
      const d2 = dist2(from.x, from.y, t.x, t.y);
      if (d2 < bestD) { bestD = d2; best = t; }
    }
    return best;
  }

  function fireBeam(from, to, w) {
    beams.push({
      x1: from.x, y1: from.y, x2: to.x, y2: to.y,
      color: w.def.color, glow: w.def.glow, life: 0.16, maxLife: 0.16,
      width: w.def === WEAPON.LARGE ? 3.2 : w.def === WEAPON.MEDIUM ? 2.4 : 1.7
    });
  }

  function fireSwarm(from, to, w) {
    const n = randInt(26, 34);
    const dots = [];
    for (let i = 0; i < n; i++) dots.push({ delay: rand(0, 0.28), ox: rand(-20, 20), oy: rand(-20, 20), arc: rand(24, 66) });
    swarms.push({ x1: from.x, y1: from.y, x2: to.x, y2: to.y, target: to, dmg: w.def.dmg, dots, dur: rand(0.85, 1.05), t: 0, resolved: false });
  }

  function fireBallistic(from, to, w) {
    const d = Math.hypot(to.x - from.x, to.y - from.y);
    const dur = clamp(d / w.def.speed, 0.05, 0.4);
    slugs.push({ x1: from.x, y1: from.y, x2: to.x, y2: to.y, target: to, dmg: w.def.dmg, color: w.def.color, glow: w.def.glow, dur, t: 0, resolved: false });
  }

  function spawnExplosion(x, y, size) {
    const n = Math.min(20, Math.floor(size * 0.9) + 8);
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), sp = rand(30, size * 4);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.7), maxLife: 0.7, r: rand(1.5, 3.5), color: pick(["#ffd27a", "#ff7a3c", "#ff3c1e", "#ffffff"]) });
    }
    shocks.push({ x, y, r: size * 0.3, maxR: size * 2.6, life: 0.4, maxLife: 0.4 });
    particles.push({ x, y, vx: 0, vy: 0, life: 0.15, maxLife: 0.15, r: size * 1.4, color: "#fff6d8", flash: true });
    if (particles.length > 500) particles.splice(0, particles.length - 500);
  }

  function sparkAt(x, y) {
    for (let i = 0; i < 3; i++) {
      const a = rand(0, TAU);
      particles.push({ x, y, vx: Math.cos(a) * rand(15, 45), vy: Math.sin(a) * rand(15, 45), life: rand(0.12, 0.22), maxLife: 0.22, r: rand(1, 2), color: "#ffd27a" });
    }
  }

  // ---------- Wave-based enemy population ----------
  const MAX_ALIVE = 9;
  const WAVE_TRIGGER = 4;

  function aliveEnemyCount() {
    let n = 0;
    for (const e of enemies) if (e.alive) n++;
    return n;
  }

  function maybeSpawnWave() {
    const alive = aliveEnemyCount();
    if (alive <= WAVE_TRIGGER) {
      const room = MAX_ALIVE - alive;
      if (room > 0) {
        const waveSize = clamp(randInt(2, 4), 1, room);
        for (let i = 0; i < waveSize; i++) enemies.push(makeEnemy(camera.x, camera.y));
      }
    }
    if (enemies.length > MAX_ALIVE + 6) enemies = enemies.filter(e => e.alive).slice(-MAX_ALIVE);
  }

  function killEnemy(e, explode) {
    if (!e.alive) return;
    e.alive = false;
    if (explode) spawnExplosion(e.x, e.y, e.cls.r);
    maybeSpawnWave();
  }

  function spawnInitialWave() {
    const n = randInt(3, 5);
    for (let i = 0; i < n; i++) enemies.push(makeEnemy(camera.x, camera.y));
  }

  // ---------- Update ----------
  function updateMechLike(m, dt, forwardAngle, avoidPush, isAlly, bias) {
    bias = bias || ZERO_BIAS;
    m.wanderPhase += dt * m.wanderSpeed;
    const wander = Math.sin(m.wanderPhase) * (isAlly ? 0.85 : 0.5);
    const fwd = { x: Math.cos(forwardAngle), y: Math.sin(forwardAngle) };
    const av = obstacleAvoidance(m.x, m.y, avoidPush);
    const sep = separation(isAlly ? allies : enemies, m, isAlly ? 50 : 30);

    let dx = fwd.x * 1.0 + av.x * 1.6 + sep.x * 0.5 + Math.cos(forwardAngle + Math.PI / 2) * wander * 0.5 + bias.x;
    let dy = fwd.y * 1.0 + av.y * 1.6 + sep.y * 0.5 + Math.sin(forwardAngle + Math.PI / 2) * wander * 0.5 + bias.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;

    const targetHeading = Math.atan2(dy, dx);
    let diff = targetHeading - m.heading;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    m.heading += diff * clamp(dt * 4, 0, 1);

    const speed = m.cls.speed;
    m.x += Math.cos(m.heading) * speed * dt;
    m.y += Math.sin(m.heading) * speed * dt;
    m.legPhase += dt * speed * 0.05;
  }

  function update(dt) {
    updateObstacles(camera.x, camera.y);

    // Allies: advance "up" the world, weave around rocks, stay loosely grouped
    let cxSum = 0, cySum = 0;
    for (const a of allies) { cxSum += a.x; cySum += a.y; }
    const centroidX = cxSum / allies.length, centroidY = cySum / allies.length;

    for (const a of allies) {
      // each ally slowly retargets a lane across the whole formation width,
      // so they drift sideways, cross paths, and swap sides over time
      a.laneTimer -= dt;
      if (a.laneTimer <= 0) {
        a.laneFrac = rand(-0.46, 0.46);
        a.laneTimer = rand(3.5, 8);
      }
      const laneTargetX = centroidX + a.laneFrac * Math.max(W, 500);
      const xBias = clamp((laneTargetX - a.x) / 150, -1, 1) * 0.8;
      // keep everyone roughly abreast instead of one mech running out front alone
      const yBias = clamp((centroidY - a.y) / 90, -1, 1) * 1.25;

      updateMechLike(a, dt, -Math.PI / 2, 55, true, { x: xBias, y: yBias });

      for (const w of a.weapons) {
        w.cd -= dt;
        if (w.cd <= 0) {
          const t = nearestTarget(a, enemies, w.def.range);
          if (t) {
            if (w.def.kind === "beam") { fireBeam(a, t, w); t.hp -= w.def.dmg; }
            else if (w.def.kind === "projectile") fireBallistic(a, t, w);
            else fireSwarm(a, t, w);
            w.cd = w.def.cd * rand(0.85, 1.2);
          } else w.cd = 0.15;
        }
      }
    }

    // Camera follows the group's advance, smoothed
    camera.x += (centroidX - camera.x) * clamp(dt * 2.0, 0, 1);
    camera.y += (centroidY - camera.y) * clamp(dt * 2.0, 0, 1);

    // Enemies: advance toward the nearest ally, take pot-shots, die under fire
    for (const e of enemies) {
      if (!e.alive) continue;
      const nearestAlly = nearestTarget(e, allies, 6000);
      let forwardAngle = Math.PI / 2;
      if (nearestAlly) forwardAngle = Math.atan2(nearestAlly.y - e.y, nearestAlly.x - e.x);
      updateMechLike(e, dt, forwardAngle, 40, false);

      e.fireCd -= dt;
      if (e.fireCd <= 0 && nearestAlly) {
        const d2 = dist2(e.x, e.y, nearestAlly.x, nearestAlly.y);
        if (d2 < 230 * 230) {
          beams.push({ x1: e.x, y1: e.y, x2: nearestAlly.x, y2: nearestAlly.y, color: "#ff9d4d", glow: "rgba(255,140,60,0.8)", life: 0.13, maxLife: 0.13, width: 1.6 });
          sparkAt(nearestAlly.x, nearestAlly.y);
        }
        e.fireCd = rand(0.6, 1.6);
      }

      if (e.hp <= 0) killEnemy(e, true);
      else if (e.y > camera.y + H * 1.4) killEnemy(e, false); // wandered far behind, remove quietly
    }
    enemies = enemies.filter(e => e.alive);

    for (const b of beams) b.life -= dt;
    beams = beams.filter(b => b.life > 0);

    for (const s of swarms) {
      s.t += dt;
      if (s.t >= s.dur && !s.resolved) {
        s.resolved = true;
        if (s.target && s.target.alive) {
          s.target.hp -= s.dmg;
          spawnExplosion(s.target.x, s.target.y, s.target.cls.r * 0.55);
          if (s.target.hp <= 0) killEnemy(s.target, true);
        }
      }
    }
    swarms = swarms.filter(s => s.t < s.dur + 0.15);

    for (const s of slugs) {
      s.t += dt;
      if (s.t >= s.dur && !s.resolved) {
        s.resolved = true;
        if (s.target && s.target.alive) {
          s.target.hp -= s.dmg;
          sparkAt(s.target.x, s.target.y);
          if (s.target.hp <= 0) killEnemy(s.target, true);
        }
      }
    }
    slugs = slugs.filter(s => s.t < s.dur + 0.08);

    for (const p of particles) {
      p.life -= dt; p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
      if (p.vx) p.vx *= 0.94;
      if (p.vy) p.vy *= 0.94;
    }
    particles = particles.filter(p => p.life > 0);

    for (const s of shocks) { s.life -= dt; s.r = lerp(s.r, s.maxR, 1 - s.life / s.maxLife); }
    shocks = shocks.filter(s => s.life > 0);

    enemies = enemies.filter(e => e.alive);
    if (aliveEnemyCount() === 0) maybeSpawnWave();
  }

  // ---------- Drawing ----------
  function drawMech(m, isAlly) {
    const r = m.cls.r;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.heading);

    // ground shadow
    ctx.beginPath();
    ctx.ellipse(2, 3, r * 1.15, r * 0.85, 0, 0, TAU);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();

    const fill = isAlly
      ? (m.cls === CLASS.ASSAULT ? "#1f9c52" : "#37c96b")
      : (m.cls === CLASS.LIGHT ? "#ff6b6b" : m.cls === CLASS.MEDIUM ? "#ff4444" : m.cls === CLASS.HEAVY ? "#e21f1f" : "#a80f0f");
    const dark = isAlly ? "#0d4d27" : "#5c0a0a";
    const stroke = isAlly ? "#0b3d1f" : "#3d0404";

    // --- legs, trailing behind the torso with a walking gait ---
    const stride = Math.sin(m.legPhase) * r * 0.42;
    const stride2 = Math.sin(m.legPhase + Math.PI) * r * 0.42;
    drawLeg(-r * 0.28, stride, r);
    drawLeg(r * 0.28, stride2, r);

    function drawLeg(ySide, phaseOff, rr) {
      const hipX = -rr * 0.3, hipY = ySide;
      const footX = hipX - rr * 0.55 + phaseOff, footY = ySide;
      ctx.save();
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = rr * 0.34;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(footX, footY); ctx.stroke();
      ctx.fillStyle = "#141a13";
      ctx.beginPath(); ctx.ellipse(footX, footY, rr * 0.16, rr * 0.12, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // --- torso: an armored hexagon, wide at the shoulders, narrow at the nose ---
    ctx.beginPath();
    ctx.moveTo(r * 0.62, 0);
    ctx.lineTo(r * 0.32, -r * 0.4);
    ctx.lineTo(r * 0.02, -r * 0.6);
    ctx.lineTo(-r * 0.42, -r * 0.5);
    ctx.lineTo(-r * 0.58, -r * 0.22);
    ctx.lineTo(-r * 0.58, r * 0.22);
    ctx.lineTo(-r * 0.42, r * 0.5);
    ctx.lineTo(r * 0.02, r * 0.6);
    ctx.lineTo(r * 0.32, r * 0.4);
    ctx.closePath();
    const grd = ctx.createLinearGradient(-r, 0, r, 0);
    grd.addColorStop(0, dark);
    grd.addColorStop(1, fill);
    ctx.fillStyle = grd; ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.strokeStyle = stroke; ctx.stroke();

    // center ridge line for a bit of armor detail
    ctx.beginPath();
    ctx.moveTo(r * 0.55, 0); ctx.lineTo(-r * 0.45, 0);
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = Math.max(0.6, r * 0.04);
    ctx.stroke();

    // --- shoulder armor pods with forward weapon barrels ---
    drawShoulder(-r * 0.62);
    drawShoulder(r * 0.62);

    function drawShoulder(ySide) {
      const podX = -r * 0.08, podW = r * 0.5, podH = r * 0.3;
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1;
      ctx.beginPath();
      roundRectPath(podX, ySide - podH / 2, podW, podH, r * 0.1);
      ctx.fill(); ctx.stroke();

      // barrel
      const barrelLen = r * 0.4;
      ctx.fillStyle = "#20241f";
      ctx.strokeStyle = stroke;
      ctx.beginPath();
      ctx.rect(podX + podW - r * 0.02, ySide - r * 0.06, barrelLen, r * 0.12);
      ctx.fill(); ctx.stroke();
    }

    function roundRectPath(x, y, w, h, rad) {
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
    }

    // --- head / cockpit, perched at the front of the torso ---
    ctx.beginPath();
    ctx.moveTo(r * 0.72, 0);
    ctx.lineTo(r * 0.44, -r * 0.2);
    ctx.lineTo(r * 0.3, 0);
    ctx.lineTo(r * 0.44, r * 0.2);
    ctx.closePath();
    ctx.fillStyle = isAlly ? "#bfffd6" : "#ffd3d3";
    ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = stroke; ctx.stroke();

    ctx.restore();
  }

  // MW5-Mercs-style rank badge floating above the mech: chevron count = weight class.
  // Drawn upright (not rotated with the mech's heading) so it always reads clearly.
  function drawClassBadge(m, isAlly) {
    const r = m.cls.r, rank = m.cls.rank;
    const w = rank * 9 + 8, hgt = 12;
    const bx = m.x, by = m.y - r - 15;
    ctx.save();
    ctx.translate(bx, by);
    ctx.fillStyle = "rgba(6,10,7,0.55)";
    roundRect(ctx, -w / 2, -hgt / 2, w, hgt, 4);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = isAlly ? "rgba(90,255,150,0.55)" : "rgba(255,110,110,0.55)";
    roundRect(ctx, -w / 2, -hgt / 2, w, hgt, 4);
    ctx.stroke();

    const col = isAlly ? "#7dffb0" : "#ff8f8f";
    const chevW = 6.4;
    const startX = -((rank - 1) * chevW) / 2;
    for (let i = 0; i < rank; i++) {
      const cx = startX + i * chevW;
      ctx.beginPath();
      ctx.moveTo(cx, 3.6);
      ctx.lineTo(cx - 2.6, -3.2);
      ctx.lineTo(cx, -1.4);
      ctx.lineTo(cx + 2.6, -3.2);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
    }
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, rad) {
    c.beginPath();
    c.moveTo(x + rad, y);
    c.arcTo(x + w, y, x + w, y + h, rad);
    c.arcTo(x + w, y + h, x, y + h, rad);
    c.arcTo(x, y + h, x, y, rad);
    c.arcTo(x, y, x + w, y, rad);
    c.closePath();
  }

  function drawBeam(b) {
    const t = b.life / b.maxLife;
    ctx.save();
    ctx.globalAlpha = clamp(t * 1.2, 0, 1);
    ctx.strokeStyle = b.glow; ctx.lineWidth = (b.width || 2) * 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    ctx.strokeStyle = b.color; ctx.lineWidth = b.width || 2;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.restore();
  }

  function drawSwarm(s) {
    for (const d of s.dots) {
      const dt = clamp((s.t - d.delay) / (s.dur - d.delay), 0, 1);
      if (dt <= 0) continue;
      const sx = lerp(s.x1 + d.ox, s.x2, dt);
      const sy = lerp(s.y1 + d.oy, s.y2, dt) - Math.sin(dt * Math.PI) * d.arc;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = "rgba(255,179,71,0.35)"; ctx.lineWidth = 1.4;
      ctx.beginPath();
      const prevT = clamp(dt - 0.05, 0, 1);
      const px = lerp(s.x1 + d.ox, s.x2, prevT);
      const py = lerp(s.y1 + d.oy, s.y2, prevT) - Math.sin(prevT * Math.PI) * d.arc;
      ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
      ctx.fillStyle = "#ffb347";
      ctx.beginPath(); ctx.arc(sx, sy, 2.4, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawSlug(s) {
    const t = clamp(s.t / s.dur, 0, 1);
    const hx = lerp(s.x1, s.x2, t), hy = lerp(s.y1, s.y2, t);
    const tailT = clamp(t - 0.09, 0, 1);
    const tx = lerp(s.x1, s.x2, tailT), ty = lerp(s.y1, s.y2, tailT);
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = s.glow; ctx.lineWidth = 3.4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(hx, hy, 1.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawParticle(p) {
    ctx.save();
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawShock(s) {
    ctx.save();
    ctx.globalAlpha = clamp(s.life / s.maxLife, 0, 1) * 0.6;
    ctx.strokeStyle = "#ffcf8a"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  const TILE = 480;
  function render() {
    ctx.save();
    ctx.fillStyle = "#0b140c";
    ctx.fillRect(0, 0, W, H);
    ctx.translate(Math.round(W / 2 - camera.x), Math.round(H * 0.68 - camera.y));

    ctx.fillStyle = terrainPattern;
    ctx.fillRect(camera.x - W / 2 - TILE, camera.y - H * 0.68 - TILE, W + TILE * 2, H + TILE * 2);

    for (const o of obstacles) drawRock(o);

    const drawables = [];
    for (const a of allies) drawables.push({ y: a.y, ally: true, m: a });
    for (const e of enemies) drawables.push({ y: e.y, ally: false, m: e });
    drawables.sort((x, y) => x.y - y.y);
    for (const d of drawables) drawMech(d.m, d.ally);
    for (const d of drawables) drawClassBadge(d.m, d.ally);

    for (const s of swarms) drawSwarm(s);
    for (const s of slugs) drawSlug(s);
    for (const b of beams) drawBeam(b);
    for (const s of shocks) drawShock(s);
    for (const p of particles) drawParticle(p);

    ctx.restore();

    ctx.fillStyle = vignetteGradient;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- Main loop ----------
  let lastT = performance.now();
  function frame(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    dt = clamp(dt, 0, 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  buildTerrainTile();
  initAllies();
  camera.x = 0; camera.y = 0;
  initObstacles(0, 0);
  spawnInitialWave();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
